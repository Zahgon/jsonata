name: Publish JSONata

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false  # never use caching in release builds
      - name: Test
        run: go vet ./... && go test ./...
      - name: Build the command line tool
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=""
            if [ "$os" = windows ]; then ext=".exe"; fi
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -o "dist/jsonata-${GITHUB_REF_NAME}-${os}-${arch}${ext}" ./cmd/jsonata
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Publish the release
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
