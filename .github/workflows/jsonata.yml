name: Build JSONata
on:
  push:
    branches: [ master, v1 ]
  pull_request:
    branches: [ master, v1 ]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.23.x', '1.24.x' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/jsonata
  documentation:
    needs: build    
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.repository == 'jsonata-js/jsonata' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Use Node.js 24.x
        uses: actions/setup-node@v3
        with:
          node-version: 24.x
      - name: Build documentation
        run: |
          cd website
          npm install
          npm run build
      - name: Deploy to GitHub Pages
        if: success()
        run: |
          cd website
          git config --global user.name "andrew-coleman"
          git config --global user.email "andrew_coleman@uk.ibm.com"
          echo "machine github.com login andrew-coleman password ${{ secrets.DOCS_AUTH }}" > ~/.netrc
          npm run publish-gh-pages
        env:
          GIT_USER: andrew-coleman
